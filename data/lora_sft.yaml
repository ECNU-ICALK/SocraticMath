# use llamafactory to train your model
### model
model_name_or_path: /path/Qwen1.5-7B-Chat # maybe you can select better moddel

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: q_proj,v_proj

### ddp
ddp_timeout: 180000000

### dataset
dataset: SocratesMATH_traindata
template: qwen
cutoff_len: 1024
max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: /path/Socraticllm
logging_steps: 10
save_strategy: epoch 
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 0.0001
num_train_epochs: 10.0
lr_scheduler_type: cosine
warmup_steps: 0.1
fp16: true

### eval
val_size: 0.1
per_device_eval_batch_size: 2
evaluation_strategy: epoch
